name: Production health check

# Scheduled, unattended monitoring of the live site — same checks as
# smoke.yml, but runs without anyone having pushed, and manages a single
# GitHub issue instead of just failing a check nobody's watching. The
# 2026-09-06 outage went unnoticed for hours because nothing was watching
# the site between deploys; this closes that gap.
#
# Reuses one issue (matched by title) rather than opening a new one per
# failed run, and closes it automatically on recovery.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  # Validate fixes to this workflow immediately instead of waiting for cron.
  push:
    branches: [v2]
    paths:
      - ".github/workflows/health.yml"

permissions:
  issues: write

env:
  INCIDENT_TITLE: "🔴 Production health check failing"
  # The job does not check out the repository, so tell gh explicitly which
  # repository to use for issue list/create/comment/close commands.
  GH_REPO: ${{ github.repository }}
  # Browser-like UA may reduce Cloudflare Bot Fight Mode challenges; IP/region rules still apply.
  HEALTH_CHECK_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36"

jobs:
  health:
    name: Health check giesmynas.adventistai.lt
    runs-on: ubuntu-latest
    steps:
      - name: Check site
        id: check
        run: |
          site="https://giesmynas.adventistai.lt"
          bust="_=$(date +%s%N)"
          fail() {
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'reason<<REASON_EOF'
              echo "$1"
              echo 'REASON_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          unverified() {
            echo "ok=unknown" >> "$GITHUB_OUTPUT"
            {
              echo 'reason<<REASON_EOF'
              echo "$1"
              echo 'REASON_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          status=$(curl -s -A "$HEALTH_CHECK_USER_AGENT" -o index.html -w '%{http_code}' --max-time 15 "$site/?$bust") || fail "GET / failed to connect"
          if [ "$status" = "403" ]; then
            unverified "GET / returned HTTP 403; this GitHub runner was denied access, so site health is unverified."
          fi
          [ "$status" = "200" ] || fail "GET / returned HTTP $status"

          asset=$(grep -o 'assets/index-[^"]*\.js' index.html | head -1)
          [ -n "$asset" ] || fail "No main JS bundle reference found in index.html — the shell markup itself may be broken."

          asset_result=$(curl -s -A "$HEALTH_CHECK_USER_AGENT" -o /dev/null -w '%{http_code} %{size_download}' --max-time 15 "$site/$asset?$bust") || fail "GET $asset failed to connect"
          astatus=${asset_result%% *}
          size=${asset_result#* }
          if [ "$astatus" = "403" ]; then
            unverified "GET $asset returned HTTP 403; this GitHub runner was denied access, so site health is unverified."
          fi
          [ "$astatus" = "200" ] || fail "index.html references $asset but it returned HTTP $astatus."
          [ "$size" -ge 50000 ] || fail "$asset is only $size bytes (expected >50000) — looks truncated, same signature as the 2026-09-06 outage."

          api_status=$(curl -s -A "$HEALTH_CHECK_USER_AGENT" -o api.json -w '%{http_code}' --max-time 15 "$site/api?$bust") || fail "GET /api failed to connect"
          if [ "$api_status" = "403" ]; then
            unverified "GET /api returned HTTP 403; this GitHub runner was denied access, so site health is unverified."
          fi
          [ "$api_status" = "200" ] || fail "GET /api returned HTTP $api_status"
          grep -q '"ok":true' api.json || fail "GET /api did not return ok:true. Body: $(cat api.json)"

          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Warn when site health is unverified
        if: steps.check.outputs.ok == 'unknown'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "::warning::$REASON"
          {
            echo "## Production health unverified"
            echo
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update incident issue
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.check.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --search "in:title \"$INCIDENT_TITLE\"" --json number --jq '.[0].number' 2>/dev/null || true)
          body=$(printf 'Automated health check against giesmynas.adventistai.lt failed:\n\n> %s\n\nRun: %s' "$REASON" "$RUN_URL")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || echo "::warning::Could not update the incident issue."
          else
            gh issue create --title "$INCIDENT_TITLE" --body "$body" --label bug || echo "::warning::Repository Issues are unavailable; use the failed workflow notification as the alert."
          fi

      - name: Close incident issue on recovery
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "in:title \"$INCIDENT_TITLE\"" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Health check passed again — closing." || echo "::warning::Could not comment on the incident issue."
            gh issue close "$existing" || echo "::warning::Could not close the incident issue."
          fi

      - name: Fail workflow when site is unhealthy
        if: steps.check.outputs.ok == 'false'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "::error::$REASON"
          exit 1
