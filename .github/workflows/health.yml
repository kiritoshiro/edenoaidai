name: Production health check

# Scheduled, unattended monitoring of the live site — same checks as
# smoke.yml, but runs without anyone having pushed, and manages a single
# GitHub issue instead of just failing a check nobody's watching. The
# 2026-09-06 outage went unnoticed for hours because nothing was watching
# the site between deploys; this closes that gap.
#
# Reuses one issue (matched by title) rather than opening a new one per
# failed run, and closes it automatically on recovery.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

env:
  INCIDENT_TITLE: "🔴 Production health check failing"

jobs:
  health:
    name: Health check giesmynas.adventistai.lt
    runs-on: ubuntu-latest
    steps:
      - name: Check site
        id: check
        run: |
          site="https://giesmynas.adventistai.lt"
          bust="_=$(date +%s%N)"
          fail() {
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo 'reason<<REASON_EOF'
              echo "$1"
              echo 'REASON_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          status=$(curl -s -o index.html -w '%{http_code}' --max-time 15 "$site/?$bust") || fail "GET / failed to connect"
          [ "$status" = "200" ] || fail "GET / returned HTTP $status"

          asset=$(grep -o 'assets/index-[^"]*\.js' index.html | head -1)
          [ -n "$asset" ] || fail "No main JS bundle reference found in index.html — the shell markup itself may be broken."

          size=$(curl -s -o /dev/null -w '%{size_download}' --max-time 15 "$site/$asset?$bust")
          astatus=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$site/$asset?$bust")
          [ "$astatus" = "200" ] || fail "index.html references $asset but it returned HTTP $astatus."
          [ "$size" -ge 50000 ] || fail "$asset is only $size bytes (expected >50000) — looks truncated, same signature as the 2026-09-06 outage."

          api=$(curl -s --max-time 15 "$site/api?$bust")
          echo "$api" | grep -q '"ok":true' || fail "GET /api did not return ok:true. Body: $api"

          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Open or update incident issue
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.check.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --search "in:title \"$INCIDENT_TITLE\"" --json number --jq '.[0].number')
          body=$(printf 'Automated health check against giesmynas.adventistai.lt failed:\n\n> %s\n\nRun: %s' "$REASON" "$RUN_URL")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$INCIDENT_TITLE" --body "$body" --label bug
          fi

      - name: Close incident issue on recovery
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "in:title \"$INCIDENT_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Health check passed again — closing."
            gh issue close "$existing"
          fi
