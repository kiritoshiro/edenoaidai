name: Security

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

jobs:
  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # server/api/config.php holds the DB password, admin_password_hash, and
      # the GitHub token the self-updater uses — it's gitignored on purpose.
      # Fail hard if it's ever actually committed, present or future commit.
      - name: config.php must never be committed
        run: |
          if git ls-files | grep -qx 'server/api/config.php'; then
            echo "::error::server/api/config.php is tracked by git. It holds the DB password and admin password hash — remove it from the index (git rm --cached) and rotate every credential it contained." >&2
            exit 1
          fi

      - name: Scan for GitHub token patterns anywhere in history-reachable files
        run: |
          if git grep -InE '(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,})' -- . ':!.github/workflows/security.yml'; then
            echo "::error::A GitHub token-shaped string was found in a tracked file. Revoke it immediately at https://github.com/settings/tokens and remove it from the file." >&2
            exit 1
          fi

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep (JS + PHP)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # `semgrep scan`, not `semgrep ci` — the latter expects a Semgrep App
      # token (SEMGREP_APP_TOKEN) for its dashboard integration, which this
      # repo doesn't have set up. --error makes findings fail the build.
      #
      # --exclude keeps this scoped to actual source (frontend/src,
      # server/api) rather than server/'s committed *build output*
      # (server/assets, sw.js, index.html, manifest.json) — the first run of
      # this workflow scanned the minified bundles too and got a real but
      # useless finding: Semgrep pattern-matched a hardcoded warning string
      # inside Workbox's own vendored, minified source as if it were
      # attacker-influenced HTML construction. Minified/vendored code isn't
      # something this project's static analysis should be judging.
      #
      # --exclude-rule drops php.lang.security.injection.tainted-filename:
      # every server/api/index.php hit it flagged (as SSRF, which doesn't
      # even apply — none of these are network calls, just is_file/unlink)
      # traces back to a value already validated against SONG_ID_RE or
      # TYPE_RE via assert_song_id()/assert_type() before reaching the
      # flagged line — confirmed by reading each call site, not assumed.
      # The rule doesn't recognize those as sanitizers. If server/api/*.php
      # gains a new filesystem call on unvalidated input, this rule being
      # off means it won't be caught here — that's a real gap this trades
      # for the false-positive noise, worth someone's periodic manual look.
      - run: >
          semgrep scan
          --config p/php --config p/javascript --config p/secrets
          --exclude 'server/assets/**' --exclude 'server/sw.js' --exclude 'server/index.html' --exclude 'server/manifest.json' --exclude 'server/version.json'
          --exclude-rule php.lang.security.injection.tainted-filename.tainted-filename
          --error
