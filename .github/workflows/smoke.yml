name: Production smoke test

# Verifies the LIVE site, not this commit. Deploys here happen separately
# (manual upload, or the admin panel's GitHub self-updater), so a failure
# here means "production is currently broken or stale" — it says nothing
# about whether the commit that triggered this run is itself good, and a
# push landing here doesn't guarantee anything was actually deployed yet.
#
# This exact check — does the bundle index.html references actually load,
# above a sane size — is what would have caught the 2026-09-06 outage
# immediately instead of it going unnoticed until a hard refresh.
#
# Unattended, scheduled monitoring (with an issue opened on failure) is a
# separate workflow: health.yml. Kept apart because "someone just pushed,
# let's check" and "nobody touched anything, is it still up" call for
# different failure handling — the latter needs dedup/issue-close logic the
# former doesn't.

on:
  push:
    branches: [v2]
  workflow_dispatch:

env:
  # Browser-like UA may reduce Cloudflare Bot Fight Mode challenges; IP/region rules still apply.
  HEALTH_CHECK_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36"
jobs:
  smoke:
    name: Smoke test giesmynas.adventistai.lt
    runs-on: ubuntu-latest
    steps:
      - name: Fetch app shell (cache-busted)
        id: shell
        run: |
          site="https://giesmynas.adventistai.lt"
          bust="_=$(date +%s%N)"

          status=$(curl -s -A "$HEALTH_CHECK_USER_AGENT" -o index.html -w '%{http_code}' --max-time 15 "$site/?$bust") || {
            echo "::error::GET / failed to connect"
            exit 1
          }
          if [ "$status" = "403" ]; then
            reason="GET / returned HTTP 403; this GitHub runner was denied access, so site health is unverified."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$reason"
            {
              echo "## Production smoke test unverified"
              echo
              echo "$reason"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::GET / returned $status"
            exit 1
          fi

          asset=$(grep -o 'assets/index-[^"]*\.js' index.html | head -1)
          if [ -z "$asset" ]; then
            echo "::error::Could not find a main JS bundle reference in index.html — the shell markup itself may be broken." >&2
            exit 1
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Fetch main bundle and check it isn't truncated
        id: bundle
        if: steps.shell.outputs.blocked != 'true'
        run: |
          site="https://giesmynas.adventistai.lt"
          bust="_=$(date +%s%N)"
          asset="${{ steps.shell.outputs.asset }}"

          status=$(curl -s -A "$HEALTH_CHECK_USER_AGENT" -o bundle.js -w '%{http_code}' --max-time 15 "$site/$asset?$bust") || {
            echo "::error::GET $asset failed to connect"
            exit 1
          }
          if [ "$status" = "403" ]; then
            reason="GET $asset returned HTTP 403; this GitHub runner was denied access, so site health is unverified."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$reason"
            {
              echo "## Production smoke test unverified"
              echo
              echo "$reason"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::index.html references $asset but it returned $status — this is exactly the failure mode from the 2026-09-06 outage (stale shell pointing at a deleted/renamed bundle)." >&2
            exit 1
          fi

          size=$(wc -c < bundle.js | tr -d '[:space:]')
          # The real bundle is ~288 KB. The corrupted one that caused the
          # outage was exactly 16,000 bytes. 50 KB is a generous floor that
          # won't false-positive on legitimate size changes but will always
          # catch truncation.
          if [ "$size" -lt 50000 ]; then
            echo "::error::$asset is only $size bytes (expected >50000) — looks truncated, the same signature as the 2026-09-06 outage." >&2
            exit 1
          fi

          echo "OK: $asset is $size bytes"

      - name: API root responds
        if: steps.shell.outputs.blocked != 'true' && steps.bundle.outputs.blocked != 'true'
        run: |
          site="https://giesmynas.adventistai.lt"
          bust="_=$(date +%s%N)"
          status=$(curl -s -A "$HEALTH_CHECK_USER_AGENT" -o api.json -w '%{http_code}' --max-time 15 "$site/api?$bust") || {
            echo "::error::GET /api failed to connect"
            exit 1
          }
          if [ "$status" = "403" ]; then
            reason="GET /api returned HTTP 403; this GitHub runner was denied access, so site health is unverified."
            echo "::warning::$reason"
            {
              echo "## Production smoke test unverified"
              echo
              echo "$reason"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::GET /api returned HTTP $status" >&2
            exit 1
          fi
          grep -q '"ok":true' api.json || {
            echo "::error::GET /api did not return ok:true. Body: $(cat api.json)" >&2
            exit 1
          }
