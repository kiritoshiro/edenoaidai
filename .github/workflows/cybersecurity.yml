name: Cybersecurity baseline
# Reusable: runs only through security-gate.yml, which owns the triggers,
# schedule and concurrency.
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  security:
    name: Cybersecurity baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Workflow security (zizmor)
      if: ${{ !cancelled() }}
      run: pipx run --spec zizmor==1.30.1 zizmor --no-online-audits --min-severity medium .github/
    - name: Dependencies and configuration (Trivy)
      if: ${{ !cancelled() }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        version: v0.74.0
        scan-type: fs
        scan-ref: .
        scanners: vuln,misconfig
        severity: HIGH,CRITICAL
        ignore-unfixed: false
        exit-code: '1'
    - name: Workflow syntax (actionlint)
      if: ${{ !cancelled() }}
      shell: bash
      run: 'set -euo pipefail

        curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        --output "$RUNNER_TEMP/actionlint.tar.gz"

        printf ''%s  %s\n'' ''8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'' "$RUNNER_TEMP/actionlint.tar.gz"
        | sha256sum --check --strict

        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

        "$RUNNER_TEMP/actionlint" -color'
