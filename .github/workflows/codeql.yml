name: CodeQL

# JavaScript/TypeScript only: CodeQL has no PHP support, so this covers the
# Vue frontend and leaves the PHP backend uncovered. That's a real gap, not
# a minor caveat — see .github/workflows/security.yml (Semgrep, p/php) for
# the backend's actual coverage, and don't treat a green CodeQL check here
# as "the API is secure."

# Reusable: runs only through security-gate.yml, which owns the triggers
# and the weekly schedule.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
