version: 2
updates:
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    workbox:
      patterns:
      - workbox-*
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
